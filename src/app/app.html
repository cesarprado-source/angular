<!-- Ancla neutra para cerrar targets (sidebar/search) -->
<span id="close" hidden></span>

<header class="navbar sticky-top bg-dark flex-md-nowrap p-0 shadow" data-bs-theme="dark">
  <a class="navbar-brand col-md-3 col-lg-2 me-0 px-3 fs-6 text-white" href="#">Company name</a>

  <!-- Acciones sólo en móvil -->
  <ul class="navbar-nav flex-row d-md-none ms-auto">
    <!-- Toggle "Search" sin JS con :target -->
    <li class="nav-item text-nowrap">
      <a class="nav-link px-3 text-white" href="#navbarSearch" aria-controls="navbarSearch" aria-label="Toggle search">
        <i class="bi bi-search"></i>
      </a>
    </li>
    <!-- Toggle "Sidebar" sin JS con :target -->
    <li class="nav-item text-nowrap">
      <a class="nav-link px-3 text-white" href="#sidebarMenu" aria-controls="sidebarMenu" aria-label="Toggle navigation">
        <i class="bi bi-list"></i>
      </a>
    </li>
  </ul>

  <!-- Barra de búsqueda colapsable (visible al hacer target en móvil; fija/inline en md+) -->
  <div id="navbarSearch" class="navbar-search w-100">
    <div class="container-fluid">
      <input class="form-control w-100 rounded-0 border-0" type="text" placeholder="Search" aria-label="Search" />
    </div>
    <!-- Cerrar búsqueda en móvil -->
    <a class="search-close d-md-none" href="#close" aria-label="Close search"></a>
  </div>
</header>

<div class="container-fluid">
  <div class="row min-vh-100">
    <!-- Sidebar -->
    <nav class="sidebar border-end col-md-3 col-lg-2 p-0 bg-body-tertiary">
      <!-- Offcanvas CSS-only -->
      <div class="offcanvas-md offcanvas-end bg-body-tertiary h-100" id="sidebarMenu" tabindex="-1">
        <div class="offcanvas-header d-md-none">
          <h5 class="offcanvas-title mb-0">Company name</h5>
          <a class="btn-close" href="#close" aria-label="Close sidebar"></a>
        </div>

        <div class="offcanvas-body d-md-flex flex-column p-0 pt-lg-3 overflow-y-auto">
          <ul class="nav flex-column">
            <li class="nav-item">
              <a
                class="nav-link d-flex align-items-center gap-2"
                routerLink="/"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: true }"
              >
                <i class="bi bi-house-fill"></i> Home
              </a>
            </li>

            <li class="nav-item">
              <a
                class="nav-link d-flex align-items-center gap-2"
                routerLink="/ui"
                routerLinkActive="active"
              >
                <i class="bi bi-file-earmark"></i> UI
              </a>
            </li>

      
           
          </ul>

        </div>
      </div>

      <!-- Backdrop del offcanvas en móvil (CSS-only). Se muestra cuando #sidebarMenu es :target -->
      <a class="sidebar-backdrop d-md-none" href="#close" aria-hidden="true"></a>
    </nav>

    <!-- Main -->
    <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 d-flex flex-column">
    
      <div class="dashboard-content flex-grow-1 overflow-auto py-3">
        <router-outlet></router-outlet>
      </div>

      <!-- Footer pegado al fondo -->
      <footer class="mt-auto py-3 bg-light border-top text-center">
        <small class="text-muted">&copy; 2025 Company name · Angular 20 + Bootstrap 5.3</small>
      </footer>
    </main>
  </div>
</div>
