<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Layout: Navbar + Sidebar (sin JS)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 (CSS solamente) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <!-- Bootstrap Icons (para los íconos bi-*) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet">

  <style>
    /* ====== Toggle sin JS (checkbox hack) ====== */
    /* Escondemos los checkboxes que controlan los toggles */
    #toggleSearch, #toggleSidebar { position:absolute; left:-9999px; }

    /* --- Buscador (collapse) --- */
    .navbar-search { display: none; }
    #toggleSearch:checked ~ .navbar .navbar-search { display: block; }

    /* --- Sidebar como offcanvas en móvil --- */
    /* Estado base en móvil: oculto (deslizable) */
    .sidebar-panel {
      position: fixed;
      inset: 0 0 0 auto;          /* ocupa alto completo, pegado a la derecha */
      width: min(85vw, 320px);
      transform: translateX(100%);
      transition: transform .25s ease;
      z-index: 1045;              /* por encima del contenido */
      background: var(--bs-body-bg);
      box-shadow: -0.25rem 0 1rem rgba(0,0,0,.15);
      display: flex; flex-direction: column;
    }
    /* Overlay cuando está abierto en móvil */
    .sidebar-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.35);
      opacity: 0; pointer-events: none;
      transition: opacity .2s ease;
      z-index: 1040;
    }
    /* Abrir con checkbox */
    #toggleSidebar:checked ~ .sidebar-overlay { opacity: 1; pointer-events: auto; }
    #toggleSidebar:checked ~ .sidebar-panel { transform: translateX(0); }

    /* Contenido scrollable dentro del panel */
    .sidebar-body { overflow: auto; }

    /* --- Layout desde md en adelante: sidebar fijo columnar --- */
    @media (min-width: 768px) {
      /* Ocultamos overlay y forzamos panel visible y estático */
      .sidebar-overlay { display: none !important; }
      .sidebar-panel {
        position: static;
        transform: none !important;
        width: 100%;
        box-shadow: none;
        inset: unset;
        height: calc(100vh - var(--topbar-h,56px)); /* ocupar alto restante */
        border-right: 1px solid var(--bs-border-color);
      }
      /* Empujar el main para usar toda la altura */
      .dashboard-content { height: 100%; }
    }

    /* Altura de la topbar para cálculo en md+ si quisieras usar position:sticky */
    :root { --topbar-h: 56px; }

    /* Opcional: estado activo visual para links */
    .nav-link.active, .nav-link[aria-current="page"] {
      font-weight: 600;
      color: var(--bs-primary) !important;
    }

    /* El contenido principal debe poder scrollear */
    .dashboard-content { overflow: auto; }

    /* Asegura que toda la columna principal crezca para “pegar” el footer abajo */
    main { display: flex; flex-direction: column; min-height: calc(100vh - var(--topbar-h)); }
  </style>
</head>
<body class="bg-body-tertiary">

  <!-- Checkboxes invisibles que controlan los toggles -->
  <input type="checkbox" id="toggleSearch" />
  <input type="checkbox" id="toggleSidebar" />

  <!-- ====== NAVBAR SUPERIOR ====== -->
  <header class="navbar sticky-top bg-dark flex-md-nowrap p-0 shadow" data-bs-theme="dark" style="height: var(--topbar-h);">
    <a class="navbar-brand col-md-3 col-lg-2 me-0 px-3 fs-6 text-white" href="#">Company name</a>

    <!-- Botonera móvil -->
    <ul class="navbar-nav flex-row d-md-none ms-auto">
      <li class="nav-item text-nowrap">
        <!-- Label que “clickkea” el checkbox #toggleSearch -->
        <label for="toggleSearch" class="nav-link px-3 text-white m-0" role="button" aria-controls="navbarSearch" aria-expanded="false" aria-label="Alternar búsqueda">
          <i class="bi bi-search"></i>
        </label>
      </li>
      <li class="nav-item text-nowrap">
        <!-- Label que “clickkea” el checkbox #toggleSidebar -->
        <label for="toggleSidebar" class="nav-link px-3 text-white m-0" role="button" aria-controls="sidebarMenu" aria-expanded="false" aria-label="Alternar navegación">
          <i class="bi bi-list"></i>
        </label>
      </li>
    </ul>

    <!-- Búsqueda (collapse sin JS) -->
    <div id="navbarSearch" class="navbar-search w-100">
      <input class="form-control w-100 rounded-0 border-0" type="text" placeholder="Buscar…" aria-label="Buscar">
    </div>
  </header>

  <!-- ====== CONTENEDOR ====== -->
  <div class="container-fluid">
    <div class="row min-vh-100">
      <!-- ====== SIDEBAR ====== -->
      <!-- Overlay (solo móvil) -->
      <label for="toggleSidebar" class="sidebar-overlay d-md-none"></label>

      <!-- Panel lateral -->
      <nav class="sidebar col-md-3 col-lg-2 p-0">
        <div class="sidebar-panel">
          <div class="d-flex align-items-center justify-content-between p-3 border-bottom">
            <h5 class="m-0">Company name</h5>
            <!-- Cerrar en móvil -->
            <label for="toggleSidebar" class="btn-close d-md-none" role="button" aria-label="Cerrar"></label>
          </div>

          <div class="sidebar-body d-flex flex-column p-0 pt-lg-3">
            <ul class="nav flex-column">
              <li class="nav-item">
                <a class="nav-link d-flex align-items-center gap-2 px-3 py-2" href="#home" aria-current="page">
                  <i class="bi bi-house-fill"></i> Home
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link d-flex align-items-center gap-2 px-3 py-2" href="#ui">
                  <i class="bi bi-file-earmark"></i> Item
                </a>
              </li>
            </ul>
          </div>
        </div>
      </nav>

      <!-- ====== MAIN ====== -->
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
        <!-- Contenido scrollable -->
        <div class="dashboard-content py-3">
          <!-- Simulación de router-outlet con secciones ancla -->
          <section id="home" class="mb-5">
            <h1 class="h3">Home</h1>
            <p class="text-body-secondary">Contenido de inicio…</p>
            <p>
              Lorem ipsum dolor sit amet, consectetur adipisicing elit. Eaque
              aperiam necessitatibus officia minus repudiandae perspiciatis.
            </p>
          </section>


          <div style="height: 40vh"></div> <!-- espacio para scrollear -->
        </div>

      </main>
    </div>
  </div>

</body>
</html>
